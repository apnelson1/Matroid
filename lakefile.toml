name = "Matroid"
keywords = ["math"]
defaultTargets = ["Matroid", "MatroidTests"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
pp.proofs.withType = false
linter.docPrime = false
linter.style.longLine = true
linter.unusedSimpArgs = true
grind.unusedLemmaThreshold = 10
# Transition aid while migrating to the module system (private decls used from public sections)
backward.privateInPublic = true

[[require]]
name = "loogle"
git = "https://github.com/nomeata/loogle"
rev = "master"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Matroid"

# Regression tests. Kept out of the source tree so that a test never has to justify its
# presence in a mathematical file, and in `defaultTargets` so that it cannot silently stop
# being run. See `tests/README.md`.
[[lean_lib]]
name = "MatroidTests"
srcDir = "tests"

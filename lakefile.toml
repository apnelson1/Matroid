name = "Matroid"
keywords = ["math"]
defaultTargets = ["Matroid", "MatroidTests"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
pp.proofs.withType = false
linter.docPrime = false
linter.style.longLine = true
linter.unusedSimpArgs = true
# grind.unusedLemmaThreshold = 10

[[require]]
name = "loogle"
git = "https://github.com/nomeata/loogle"
rev = "master"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Matroid"

# Regression tests. See `tests/README.md`.
[[lean_lib]]
name = "MatroidTests"
srcDir = "tests"
